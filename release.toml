# Accordion suite release manifest.
#
# Every component has its own repo and version. A suite release pins the exact
# version of each component, tested together as one set. Servers only ever
# install a set listed in a published manifest, so components can't drift out
# of step.
#
# To make a suite release:
#   1. Update the component versions below.
#   2. Raise the suite version.
#   3. Let CI test the full set, then tag this repo with the suite version.

[suite]
version = "0.0.0"

# Component versions, added as each component makes its first release.
[components]
# core    = "0.1.0"
# gateway = "0.1.0"
# drive   = "0.1.0"
# notes   = "0.1.0"
# web     = "0.1.0"
