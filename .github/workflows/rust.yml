# Shared CI for every Accordion Rust repo.
#
# Other repos call this workflow instead of keeping their own copy, so a fix
# here reaches every repo at once. templates/repo/.github/workflows/ci.yml is
# the caller that new repos start with.

name: Rust

on:
  workflow_call:
    inputs:
      linux-packages:
        description: >-
          Ubuntu packages the repo needs to build, such as the desktop app's
          GTK and WebKit libraries. Separated by spaces.
        type: string
        default: ""
      windows:
        description: Also lint and test on Windows, as the desktop app needs.
        type: boolean
        default: false

permissions:
  contents: read

# Third-party actions are pinned to a commit, with their version beside it,
# so a tag that moves can't change what runs. Dependabot proposes new
# versions. Rust comes from rustup, which GitHub's runners have already.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the repo's packages
        if: inputs.linux-packages != ''
        env:
          PACKAGES: ${{ inputs.linux-packages }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $PACKAGES
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # Native ARM64 runner, so tests also cover the Raspberry Pi target
          # without cross-compiling.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the repo's packages
        if: inputs.linux-packages != ''
        env:
          PACKAGES: ${{ inputs.linux-packages }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends $PACKAGES
      # restic makes backups (decision 8), and core's backup tests run it.
      # The checksums are from restic's signed SHA256SUMS for this version.
      - name: Install restic
        env:
          RESTIC_VERSION: 0.19.1
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            x86_64) platform=linux_amd64 sha256=f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c ;;
            arm64) platform=linux_arm64 sha256=a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465 ;;
          esac
          file="restic_${RESTIC_VERSION}_${platform}.bz2"
          curl -fsSLo "$file" "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/${file}"
          echo "${sha256}  ${file}" | sha256sum --check
          bunzip2 "$file"
          sudo install -m 0755 "${file%.bz2}" /usr/local/bin/restic
          rm "${file%.bz2}"
          restic version
      # Core's tests back up to rclone's S3 server, which stands in for a
      # storage provider. The checksums are from rclone's signed SHA256SUMS
      # for this version. rclone reads every RCLONE_ variable as one of its
      # own settings, so the version is in RELEASE instead.
      - name: Install rclone
        env:
          RELEASE: 1.75.2
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            x86_64) platform=linux-amd64 sha256=349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702 ;;
            arm64) platform=linux-arm64 sha256=7e1e8d69654941b7b7df84ee74c5f7fb09cce7d5496947fb7bf16b55ff427d10 ;;
          esac
          name="rclone-v${RELEASE}-${platform}"
          curl -fsSLo "${name}.zip" "https://github.com/rclone/rclone/releases/download/v${RELEASE}/${name}.zip"
          echo "${sha256}  ${name}.zip" | sha256sum --check
          unzip -q "${name}.zip"
          sudo install -m 0755 "${name}/rclone" /usr/local/bin/rclone
          rm -r "${name}" "${name}.zip"
          rclone version
      # Core's thumbnail tests run libvips, poppler, ffmpeg, LibreOffice,
      # LibRaw, librsvg, djvulibre, and SoX in the sandbox (decisions 14,
      # 15, 17, and 26), and make their test images with libheif's AV1
      # encoder, their test videos with ffmpeg, their test documents with
      # LibreOffice, their test DjVu book with djvulibre, and their test
      # sounds in older formats with SoX.
      - name: Install the thumbnail programs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libvips-tools \
            libheif-plugin-libde265 libheif-plugin-aomdec libheif-plugin-aomenc poppler-utils ffmpeg \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui fonts-liberation2 \
            libraw-bin librsvg2-bin djvulibre-bin sox libsox-fmt-base
          vips --version
          ffmpeg -hide_banner -version | head -n 1
          pdftoppm -v 2>&1 | head -n 1
          soffice --version
          rsvg-convert --version
          ddjvu --help 2>&1 | head -n 1
          sox --version
      # Decision 11: the tests run under strace, and the build fails if
      # anything connects to another machine. The script lives in the
      # accordion repo, so other repos fetch it here. Building first keeps
      # cargo's own downloads out of the check.
      - name: Install strace
        run: |
          if ! command -v strace > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q strace
          fi
          strace -V | head -n 1
      - name: Get the connection check
        uses: actions/checkout@v7
        with:
          repository: accordion-suite/accordion
          path: .accordion-ci
          sparse-checkout: scripts/check-connections.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cargo test --workspace --all-features --locked --no-run
      - run: python3 .accordion-ci/scripts/check-connections.py cargo test --workspace --all-features --locked --offline

  # The desktop app's Windows code, such as Cloud Files, only builds on
  # Windows. The connection check needs strace, so it stays with the Linux
  # tests, which run the same tests.
  windows:
    name: Test (Windows)
    if: inputs.windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked

  deny:
    name: Licenses, advisories, and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Reads deny.toml from the calling repo. Fails on dependencies whose
      # license is incompatible with AGPL-3.0, on known vulnerabilities, and on
      # crates from unexpected registries or Git hosts.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
