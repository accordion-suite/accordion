version: 2
updates:
  # Group dependency updates into one weekly pull request instead of one each.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # Types match the oldest Node.js the repo supports (22, Ubuntu's), so the
    # type check rejects functions that Node.js 22 doesn't have.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
